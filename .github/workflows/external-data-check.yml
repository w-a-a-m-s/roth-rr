name: External data check
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Check federal-tax and medicare fallback staleness
        run: npm run external-data:check
        env:
          # Optional: set secrets to also drift-check against a live deploy.
          EXTERNAL_DATA_API_URL: ${{ secrets.EXTERNAL_DATA_API_URL }}
