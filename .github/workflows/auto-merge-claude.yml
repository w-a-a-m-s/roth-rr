name: Auto-merge Claude branches

on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write

# One wait per branch. A newer push on that branch cancels this run and starts over.
concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 120
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Merge into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.ref }}"
          git merge --no-edit "${{ github.sha }}"
          git push origin main
